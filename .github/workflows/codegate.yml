name: LeakGuard CodeGate CI

on:
  push:
    branches: [main, master, ast/cfg, ast-cfg]
  pull_request:
    branches: [main, master, ast/cfg, ast-cfg]

jobs:
  leakguard-scan:
    name: LeakGuard Resource-Leak Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Analyzer Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-scalpel --no-deps
          pip install astor graphviz typeshed-client pycg libcst
          pip install -e .

      - name: Run LeakGuard CodeGate Analysis
        id: leakguard
        run: |
          python -m codegate.ci . --ensemble | tee leakguard-report.txt

      - name: Upload Scan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-scan-report
          path: leakguard-report.txt
          if-no-files-found: ignore
