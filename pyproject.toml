[project]
name = "codegate"
version = "0.1.0"
description = "CodeGate: Static resource-leak analyzer for Python (Scalpel CFG + LibCST fix)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "libcst>=1.0",
    "networkx",
    "astor",
    "astunparse",
    "graphviz",
    "httpx>=0.25",
    "python-dotenv",
]

[project.scripts]
codegate = "codegate.cli:main"

[project.optional-dependencies]
ensemble = ["semgrep>=1.60", "ruff>=0.4"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["codegate*"]
