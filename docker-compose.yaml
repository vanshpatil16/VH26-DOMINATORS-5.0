version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: codegate/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/client/Dockerfile
    ports:
      - "3001:80"           # Caddy serves on port 80 internally
    restart: unless-stopped
